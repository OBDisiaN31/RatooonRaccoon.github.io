<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratooon Raccoon's</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="images/svg" href="images/icon.svg">
</head>
<body>
    <header class="header">
        <div class="container">
                <img src="images/logo.svg" alt="RatooonRaccoon_logo" width="155" height=auto>
            <nav class="header__nav">
                <a href="#!" class="header__link">Home</a>
                <a href="#!" class="header__link">Works</a>
                <a href="#!" class="header__link">Projects</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="welcome">
            <div class="welcome__desc">
                <div class="container">
                    <img src="images/me.svg" alt="welcome_img_1" class="welcome__img_1" width="450" height=auto>
                    <img src="images/me2.svg" alt="welcome_img_2" class="welcome__img_2" width="450" height=auto>
                    <h1 class="welcome__title">Йоу-йоу-йоу, здоров!

                    </h1>
                    <p class="welcome__text">Здесь есть информация обо мне, моих проектах, работах и прочем.</p>
                    <p class="welcome__text">И здесь пока что пусто...</p>
                    <p class="welcome__text">Но это скоро исправится...</p>
                    <p class="welcome__text">Честно...</p>
                    <p class="welcome__text">↓↓↓</p>
                </div>
           </div>
        </section>

        <section class="works">
            <div class="container">
                <div class="works__wrapper">
                    <a href="#!" class="work">
                        <img src="images/works.png" alt="works" class="work__img">
                        <span class="work__name">РАБОТЫ</span>
                    </a>
                    <a href="#!" class="work">
                        <img src="images/lore.png" alt="lore" class="work__img">
                        <span class="work__name">ЛОР ПЕРСОНАЖЕЙ</span>
                    </a>
                    <a href="#!" class="work">
                        <img src="images/projects.png" alt="projects" class="work__img">
                        <span class="work__name">ПРОЕКТЫ</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="bottom">
            
        </section>
